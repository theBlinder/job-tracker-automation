<!DOCTYPE html>
<html>
<head>
  <title>Job Tracker</title>
</head>

<body>
  <h1>Job Application Tracker</h1>

  <form>
    <label>Company</label><br>
    <input type="text" name="Company"><br><br>

    <label>Role</label><br>
    <input type="text" name="Role"><br><br>

    <label>Experience Required</label><br>
    <input type="text" name="Exp_required"><br><br>

    <label>Location</label><br>
    <input type="text" name="Location"><br><br>

    <label>Skills</label><br>
    <input type="text" name="Skills"><br><br>

    <label>Work Mode</label><br>
    <input type="text" name="Work_mode"><br><br>

    <label>Job ID</label><br>
    <input type="text" name="Job_id"><br><br>

    <label>Job Link</label><br>
    <input type="text" name="Job_link"><br><br>

    <label>Applied</label><br>
    <select name="Applied">
      <option>Yes</option>
      <option>No</option>
    </select><br><br>

    <label>Referral Asked</label><br>
    <select name="Referral_asked">
      <option>No</option>
      <option>Yes</option>
    </select><br><br>

    <label>Posted Date</label><br>
    <input type="text" name="Posted"><br><br>

   <button type="submit" id="saveButton" style="background-color: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer;">
  Save Job
</button>
    <p id="statusMessage"></p>
  </form>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyhZ4kwWBGxXoscTzyNOwaznXij-KcqZJn62PhaOy4ZczlMIdpafq2H3QKcUOeft22K/exec";

     const form = document.querySelector("form");
  const saveButton = document.getElementById("saveButton");
  const statusMessage = document.getElementById("statusMessage");

  const jobLinkInput = document.querySelector('input[name="Job_link"]');
const jobIdInput = document.querySelector('input[name="Job_id"]');

function detectJobIdFromUrl(jobUrl) {
  try {
    const url = new URL(jobUrl);
    const parts = url.pathname.split("/").filter(Boolean);

    for (const part of parts) {
      const idMatch = part.match(/^(?=.*\d)[A-Za-z0-9-]{6,}$/);
      if (idMatch) {
        return idMatch[0];
      }
    }

    const params = ["jobReferenceCode", "id", "jobId", "jobID", "reqId", "requisitionId", "wdjobreqid", "referenceCode"];

    for (const param of params) {
      const value = url.searchParams.get(param);
      if (value) {
        return value;
      }
    }

    return "";
  } catch {
    return "";
  }
}

jobLinkInput.addEventListener("blur", function () {
  const detectedJobId = detectJobIdFromUrl(jobLinkInput.value);

  if (detectedJobId && !jobIdInput.value) {
    jobIdInput.value = detectedJobId;
  }
});

  form.addEventListener("submit", async function (event) {
    event.preventDefault();

    saveButton.disabled = true;
    saveButton.innerText = "Saving...";
    statusMessage.innerText = "Saving job, please wait...";

    const formData = new FormData(event.target);
    const jobData = Object.fromEntries(formData.entries());

    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(jobData)
      });

      statusMessage.innerText = "Job saved successfully.";
      event.target.reset();
    } catch (error) {
      statusMessage.innerText = "Failed to save job. Please try again.";
    }

    saveButton.disabled = false;
    saveButton.innerText = "Save Job";
  });
  </script>
</body>
</html>
